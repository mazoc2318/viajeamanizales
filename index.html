<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A cute viaje manizales">
  <meta name="theme-color" content="#ffd0e5">
  <title>Salida a Manizales!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    .gradient-background {
      background: linear-gradient(180deg, #ffd0e5 0%, #ffe8f2 36%, #ffffff 100%);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .hero-image {
      width: min(100%, 420px);
      height: clamp(180px, 38dvh, 300px);
    }

    .question {
      font-size: clamp(1.75rem, 7vw, 2.25rem);
      line-height: 1.15;
      text-wrap: balance;
    }

    #noButton.is-evasive {
      position: fixed;
      z-index: 50;
      transition:
        left 180ms ease-out,
        top 180ms ease-out,
        background-color 150ms ease;
    }

    .bounce {
      animation: bounce 2s ease infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }
  </style>
  <!-- Preload images so transitions feel instant -->
  <link rel="preload" as="image" href="./images/image1.gif">
  <link rel="preload" as="image" href="./images/image2.gif">
  <link rel="preload" as="image" href="./images/image3.gif">
  <link rel="preload" as="image" href="./images/image4.gif">
  <link rel="preload" as="image" href="./images/image5.gif">
  <link rel="preload" as="image" href="./images/image6.gif">
  <link rel="preload" as="image" href="./images/image7.gif">
</head>
<body class="gradient-background">
  <main class="flex min-h-screen min-h-[100dvh] items-center justify-center px-4 py-6 sm:px-6">
    <section class="flex w-full max-w-3xl flex-col items-center">
      <img
        id="imageDisplay"
        src="./images/image1.gif"
        alt="Cute kitten with flowers"
        class="hero-image rounded-md object-cover"
      />
      <h1 id="viajeQuestion" class="question my-4 max-w-2xl text-center font-bold italic text-[#bd1e59]">
        Te Gustaria ir a Manizales conmigo?
      </h1>
      <div id="responseButtons" class="flex max-w-full flex-wrap items-center justify-center gap-3 pt-3 sm:gap-4 sm:pt-5">
        <button
          id="yesButton"
          class="bounce inline-flex items-center justify-center whitespace-nowrap rounded-md text-xl font-medium cursor-pointer px-4 py-2 bg-green-500 text-white transition-all duration-300 ease-in-out hover:bg-green-400 min-h-12 min-w-[75px]"
        >
          Yes
        </button>
        <button
          id="noButton"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-xl font-medium cursor-pointer px-4 py-2 bg-red-500 text-white transition-colors hover:bg-red-700 h-12 min-w-[75px]"
        >
          No
        </button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      // DOM references
      const yesButton = document.getElementById('yesButton');
      const noButton = document.getElementById('noButton');
      const imageDisplay = document.getElementById('imageDisplay');
      const viajeQuestion = document.getElementById('viajeQuestion');
      const responseButtons = document.getElementById('responseButtons');

      // Configuration
      const GROWTH_PER_CLICK = 35;
      const FONT_GROWTH_PER_CLICK = 25;
      const MAX_NO_CLICKS = 5;
      const VIEWPORT_MARGIN = 16;
      const POINTER_ESCAPE_DISTANCE = 110;
      const MIN_POINTER_LANDING_DISTANCE = 180;

      const IMAGE_PATHS = [
        './images/image1.gif',
        './images/image2.gif',
        './images/image3.gif',
        './images/image4.gif',
        './images/image5.gif',
        './images/image6.gif',
        './images/image7.gif',
      ];

      const NO_BUTTON_MESSAGES = [
        'No',
        'Estas segura?',
        'Pookie please',
        "no me hagas esto a mi :(",
        "estas rompiendo mi corazon",
        "voy a llorar...",
      ];

      const ALT_TEXTS = [
        'Cute kitten with flowers',
        'Sad kitten looking up',
        'Kitten begging',
        'Heartbroken kitten',
        'Crying kitten',
        'Devastated kitten',
        'Happy kitten celebrating',
      ];

      // State
      let noClickCount = 0;
      let buttonHeight = 48;
      let buttonWidth = 80;
      let fontSize = 20;

      const hasFinePointer = () =>
        window.matchMedia('(hover: hover) and (pointer: fine)').matches;

      const fitYesButtonToViewport = () => {
        const availableWidth = Math.max(75, window.innerWidth - (VIEWPORT_MARGIN * 2));
        const maxHeight = Math.max(48, window.innerHeight * 0.28);
        const renderedHeight = Math.min(buttonHeight, maxHeight);
        const maxFontSize = Math.max(
          28,
          Math.min(window.innerWidth * 0.14, renderedHeight * 0.55, 96)
        );

        yesButton.style.height = `${renderedHeight}px`;
        yesButton.style.width = `${Math.min(buttonWidth, availableWidth)}px`;
        yesButton.style.fontSize = `${Math.min(fontSize, maxFontSize)}px`;
      };

      const distanceBetween = (x1, y1, x2, y2) =>
        Math.hypot(x2 - x1, y2 - y1);

      const moveNoButton = (pointerX, pointerY) => {
        noButton.classList.add('is-evasive');

        const buttonRect = noButton.getBoundingClientRect();
        const maxLeft = Math.max(VIEWPORT_MARGIN, window.innerWidth - buttonRect.width - VIEWPORT_MARGIN);
        const maxTop = Math.max(VIEWPORT_MARGIN, window.innerHeight - buttonRect.height - VIEWPORT_MARGIN);
        let nextLeft = VIEWPORT_MARGIN;
        let nextTop = VIEWPORT_MARGIN;

        for (let attempt = 0; attempt < 12; attempt++) {
          const candidateLeft =
            VIEWPORT_MARGIN + Math.random() * Math.max(0, maxLeft - VIEWPORT_MARGIN);
          const candidateTop =
            VIEWPORT_MARGIN + Math.random() * Math.max(0, maxTop - VIEWPORT_MARGIN);
          const candidateCenterX = candidateLeft + (buttonRect.width / 2);
          const candidateCenterY = candidateTop + (buttonRect.height / 2);

          nextLeft = candidateLeft;
          nextTop = candidateTop;

          if (
            pointerX === undefined ||
            distanceBetween(pointerX, pointerY, candidateCenterX, candidateCenterY) >=
              MIN_POINTER_LANDING_DISTANCE
          ) {
            break;
          }
        }

        noButton.style.left = `${nextLeft}px`;
        noButton.style.top = `${nextTop}px`;
      };

      const keepNoButtonInViewport = () => {
        if (!noButton.classList.contains('is-evasive')) return;

        const buttonRect = noButton.getBoundingClientRect();
        const maxLeft = Math.max(VIEWPORT_MARGIN, window.innerWidth - buttonRect.width - VIEWPORT_MARGIN);
        const maxTop = Math.max(VIEWPORT_MARGIN, window.innerHeight - buttonRect.height - VIEWPORT_MARGIN);

        noButton.style.left = `${Math.min(Math.max(buttonRect.left, VIEWPORT_MARGIN), maxLeft)}px`;
        noButton.style.top = `${Math.min(Math.max(buttonRect.top, VIEWPORT_MARGIN), maxTop)}px`;
      };

      noButton.addEventListener('click', (event) => {
        if (noClickCount >= MAX_NO_CLICKS) {
          event.preventDefault();
          moveNoButton(event.clientX, event.clientY);
          return;
        }

        noClickCount++;

        // Update image and alt text
        imageDisplay.src = IMAGE_PATHS[noClickCount];
        imageDisplay.alt = ALT_TEXTS[noClickCount];

        // Grow the "Yes" button to make it harder to ignore
        buttonHeight += GROWTH_PER_CLICK;
        buttonWidth += GROWTH_PER_CLICK;
        fontSize += FONT_GROWTH_PER_CLICK;

        fitYesButtonToViewport();

        // Update "No" button text with increasingly desperate messages
        noButton.textContent = NO_BUTTON_MESSAGES[noClickCount];
      });

      document.addEventListener('pointermove', (event) => {
        if (noClickCount < MAX_NO_CLICKS || !hasFinePointer()) return;

        const buttonRect = noButton.getBoundingClientRect();
        const nearestX = Math.max(buttonRect.left, Math.min(event.clientX, buttonRect.right));
        const nearestY = Math.max(buttonRect.top, Math.min(event.clientY, buttonRect.bottom));

        if (
          distanceBetween(event.clientX, event.clientY, nearestX, nearestY) <
          POINTER_ESCAPE_DISTANCE
        ) {
          moveNoButton(event.clientX, event.clientY);
        }
      });

      window.addEventListener('resize', () => {
        fitYesButtonToViewport();
        keepNoButtonInViewport();
      });

      yesButton.addEventListener('click', () => {
        imageDisplay.src = IMAGE_PATHS[IMAGE_PATHS.length - 1];
        imageDisplay.alt = ALT_TEXTS[ALT_TEXTS.length - 1];
        viajeQuestion.textContent = 'Sera un viaje inolvidable!! :3';
        responseButtons.style.display = 'none';

        // Heart-shaped confetti for a valentine theme
        const heart = confetti.shapeFromPath({
          path: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',
        });

        const defaults = { spread: 360, ticks: 100, gravity: 0, decay: 0.94, startVelocity: 20, shapes: [heart], colors: ['#ff69b4', '#ff1493', '#ff6b81', '#e84393'] };

        confetti({ ...defaults, particleCount: 50, scalar: 2 });
        confetti({ ...defaults, particleCount: 25, scalar: 3 });
        confetti({ ...defaults, particleCount: 10, scalar: 4 });
      });
    })();
  </script>
</body>
</html>
